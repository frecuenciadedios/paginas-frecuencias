<style>
  :root{
    --noche:#07060F;
    --tinta:#F6F3FF;
    --tinta-2:#C9C1E4;
    --tinta-3:#8E86AD;
    --spotify:#1DB954;
    --vidrio:rgba(255,255,255,.055);
    --borde:rgba(255,255,255,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100dvh;
    background:var(--noche);
    color:var(--tinta);
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-weight:400;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    display:flex;align-items:center;justify-content:center;
    padding:clamp(16px,4vw,40px) clamp(14px,4vw,24px);
    padding-bottom:calc(clamp(16px,4vw,40px) + env(safe-area-inset-bottom));
  }

  /* ── Fondo vivo: la portada difuminada, con deriva lenta ── */
  .atmosfera{position:fixed;inset:0;z-index:-2;overflow:hidden;background:var(--noche)}
  .atmosfera img{
    position:absolute;top:50%;left:50%;
    width:135%;height:135%;
    transform:translate(-50%,-50%);
    object-fit:cover;
    filter:blur(58px) saturate(1.35) brightness(.62);
    animation:deriva 34s ease-in-out infinite alternate;
  }
  @keyframes deriva{
    from{transform:translate(-51%,-50%) scale(1)}
    to  {transform:translate(-49%,-51%) scale(1.09)}
  }
  .velo{
    position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(78% 55% at 50% 8%, rgba(120,90,220,.30) 0%, transparent 62%),
      linear-gradient(180deg, rgba(7,6,15,.42) 0%, rgba(7,6,15,.80) 55%, rgba(7,6,15,.95) 100%);
  }
  /* respiración: un latido de luz muy lento */
  .aliento{
    position:fixed;left:50%;top:-14%;transform:translateX(-50%);
    width:min(760px,145vw);height:min(560px,90vw);
    z-index:-1;pointer-events:none;
    background:radial-gradient(circle, rgba(168,140,255,.20) 0%, transparent 68%);
    animation:respirar 9s ease-in-out infinite;
  }
  @keyframes respirar{
    0%,100%{opacity:.55;transform:translateX(-50%) scale(1)}
    50%    {opacity:.95;transform:translateX(-50%) scale(1.13)}
  }

  /* ── La carta ── */
  .carta{
    position:relative;
    width:100%;max-width:392px;
    background:var(--vidrio);
    border:1px solid var(--borde);
    border-radius:26px;
    backdrop-filter:blur(26px) saturate(1.25);
    -webkit-backdrop-filter:blur(26px) saturate(1.25);
    box-shadow:0 30px 90px rgba(0,0,0,.62), inset 0 1px 0 rgba(255,255,255,.09);
    overflow:hidden;
    animation:aparecer .95s cubic-bezier(.2,.7,.25,1) both;
  }
  @keyframes aparecer{
    from{opacity:0;transform:translateY(26px) scale(.975)}
    to  {opacity:1;transform:none}
  }

  .escena{position:relative;aspect-ratio:16/11;overflow:hidden}
  .escena img{
    width:100%;height:100%;object-fit:cover;display:block;
    animation:acercar 26s ease-in-out infinite alternate;
  }
  @keyframes acercar{ from{transform:scale(1.02)} to{transform:scale(1.13)} }
  .escena::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(7,6,15,.05) 0%, rgba(7,6,15,.30) 48%, rgba(7,6,15,.92) 100%);
  }

  .insignia{
    position:absolute;top:14px;left:14px;z-index:2;
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 12px;border-radius:999px;
    background:rgba(10,8,20,.52);
    border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    font-size:11.5px;font-weight:500;letter-spacing:.02em;color:var(--tinta-2);
  }
  .insignia svg{width:12px;height:12px;opacity:.85}

  .rotulo{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:0 20px 17px}
  h1{
    font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;
    font-weight:300;
    font-size:clamp(30px,8.6vw,38px);
    line-height:1.02;
    letter-spacing:.004em;
    text-shadow:0 2px 26px rgba(0,0,0,.6);
  }
  h1 em{font-style:italic;font-weight:400}
  .aire{
    margin-top:9px;
    font-size:11.5px;font-weight:400;letter-spacing:.13em;text-transform:uppercase;
    color:rgba(230,222,255,.72);
  }

  .cuerpo{padding:17px 20px 20px}
  .es{font-size:14.5px;color:var(--tinta-2);font-weight:300;line-height:1.55}
  .pt{margin-top:5px;font-size:12.5px;color:var(--tinta-3);font-weight:300;font-style:italic;line-height:1.5}

  /* ── El botón: el corazón de la página ── */
  .escuchar{
    display:flex;align-items:center;justify-content:center;gap:11px;
    margin-top:18px;padding:17px 22px;min-height:56px;
    border-radius:999px;text-decoration:none;
    background:linear-gradient(180deg,#25D366 0%,var(--spotify) 100%);
    color:#04240F;
    font-size:16.5px;font-weight:600;letter-spacing:-.008em;
    box-shadow:0 0 0 0 rgba(29,185,84,.42), 0 12px 30px rgba(29,185,84,.26);
    animation:pulso 3.4s ease-in-out infinite;
    transition:transform .14s ease, filter .14s ease;
  }
  @keyframes pulso{
    0%,100%{box-shadow:0 0 0 0 rgba(29,185,84,.40), 0 12px 30px rgba(29,185,84,.24)}
    50%    {box-shadow:0 0 0 13px rgba(29,185,84,0), 0 12px 34px rgba(29,185,84,.34)}
  }
  .escuchar:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .escuchar:active{transform:scale(.985)}
  .escuchar svg{width:21px;height:21px;flex:none}
  .gratis{margin-top:10px;text-align:center;font-size:11.5px;letter-spacing:.06em;color:var(--tinta-3)}

  /* ── Los tracks ── */
  .tracks{margin:16px 14px 15px;border-radius:15px;overflow:hidden;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.06)}
  .tracks iframe{display:block;width:100%;height:232px;border:0}

  .firma{
    text-align:center;padding:0 20px 17px;
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(142,134,173,.62);
  }

  @media(max-width:344px){
    .escena{aspect-ratio:16/12}
    .cuerpo{padding:15px 17px 18px}
    .rotulo{padding:0 17px 15px}
    .tracks iframe{height:212px}
  }
  @media(min-width:1024px){
    .carta{max-width:412px}
  }
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
