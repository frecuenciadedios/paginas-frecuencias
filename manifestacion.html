<style>
  :root{
    --bg:#0D0A18; --glow:#2E2258; --card:#171230; --card-2:#1F1940;
    --edge:#2E2656; --ink:#F4F1FC; --ink-2:#B4AAD4; --ink-3:#7C7299;
    --spotify:#1DB954;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg);
    background-image:radial-gradient(130% 55% at 50% 0%, var(--glow) 0%, var(--bg) 68%);
    background-attachment:fixed;
    min-height:100dvh; color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    line-height:1.45; -webkit-font-smoothing:antialiased;
    padding:16px 14px calc(24px + env(safe-area-inset-bottom));
    display:flex; justify-content:center;
  }
  .card{
    width:100%; max-width:400px;
    background:var(--card); border:1px solid var(--edge);
    border-radius:18px; overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.5);
    align-self:flex-start;
  }
  /* Portada más chica: deja lugar al botón sin scrollear */
  .top{display:flex; gap:13px; padding:14px 14px 0; align-items:center}
  .art{
    width:88px; height:88px; flex:none;
    border-radius:12px; object-fit:cover; background:var(--card-2);
  }
  .titles{min-width:0}
  h1{font-size:17px; font-weight:650; letter-spacing:-.015em; line-height:1.25}
  .es{color:var(--ink-2); font-size:13.5px; margin-top:5px}
  .pt{color:var(--ink-3); font-size:12.5px; margin-top:3px; font-style:italic}

  /* El botón, lo primero que se ve completo */
  .cta{padding:14px}
  .play{
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:16px 18px; min-height:54px;
    background:var(--spotify); color:#062812;
    border-radius:999px; text-decoration:none;
    font-size:16.5px; font-weight:700; letter-spacing:-.01em;
    transition:filter .12s, transform .1s;
  }
  .play:hover{filter:brightness(1.07)}
  .play:active{transform:scale(.987)}
  .play svg{width:21px;height:21px;flex:none}
  .free{text-align:center;color:var(--ink-3);font-size:12px;margin-top:9px}

  /* Los tracks, para quien quiera mirar antes de entrar */
  .player{margin:0 14px 14px;border-radius:12px;overflow:hidden;background:var(--card-2)}
  .player iframe{display:block;width:100%;height:232px;border:0}

  @media(max-width:340px){
    .art{width:74px;height:74px}
    h1{font-size:15.5px}
    .player iframe{height:212px}
  }
  @media(min-width:900px){ body{align-items:center} }
</style>
